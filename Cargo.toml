[package]
name = "v2tui"
version = "0.2.0"
edition = "2021"
description = "Terminal UI to browse, ping and connect to V2Ray/Xray subscription links"

[dependencies]
ratatui = "0.29"
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = true
strip = true
